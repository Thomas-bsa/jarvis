let pdfjsP = null;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Bibliothèque PDF indisponible.")); document.head.appendChild(s); }); }
function loadPdfjs(){
  if (!pdfjsP) pdfjsP = loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js")
    .then(() => loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")).then(() => window.pdfjsLib)
    .catch(e => { pdfjsP = null; throw e; });
  return pdfjsP;
}
/* Récupère les octets d'un PDF stocké : vérifie qu'on reçoit bien un PDF, réessaie sans cache puis via l'adresse fournie par le stockage. */
const isPdfBytes = buf => new TextDecoder("latin1").decode(new Uint8Array(buf.slice(0, 1024))).includes("%PDF");
async function fetchPdfBytes(src){
  const id = "";
  let last = "", listed = false;
  const urls = [src];
  for (let i = 0; i < urls.length; i++){
    for (const opt of [{}, {cache: "reload", credentials: "include"}]){
      try {
        const r = await fetch(urls[i], opt), buf = await r.arrayBuffer();
        if (r.ok && isPdfBytes(buf)) return buf;
        last = `réponse ${r.status}${r.headers.get("content-type") ? ", " + r.headers.get("content-type").split(";")[0] : ""}, ${buf.byteLength} octets`;
      } catch(e){ last = (e && e.message) || String(e); }
    }
    if (!listed && id && assets){
      listed = true;
      try { const l = await assets.list(), a = ((l && l.assets) || []).find(x => x.id === id);
        if (!a) last = "fichier introuvable dans le stockage";
        else if (a.url && !urls.includes(a.url)) urls.push(a.url); } catch(e){}
    }
  }
  const err = new Error(`Le PDF n'a pas pu être récupéré depuis le stockage (${last}).`); err.code = "pdf_fetch"; throw err;
}
async function openPdf(src){
  const lib = await loadPdfjs();
  const buf = src instanceof ArrayBuffer ? src : await fetchPdfBytes(src);
  if (!isPdfBytes(buf)){ const err = new Error("Ce fichier n'est pas un PDF lisible."); err.code = "pdf_fetch"; throw err; }
  try { return await lib.getDocument({data: new Uint8Array(buf.slice(0)), isEvalSupported: false}).promise; }
  catch(e){ const err = new Error("Ce PDF est endommagé ou protégé et ne peut pas être lu (" + ((e && e.message) || "erreur inconnue") + ")."); err.code = "pdf_fetch"; throw err; }
}
async function uploadPdfs(files, deck){
  files = files.filter(f => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
  if (!files.length){ toast("Seuls les fichiers PDF sont acceptés."); return; }
  for (const f of files){
    if (f.size > 20 * 1048576){ toast(`« ${f.name} » dépasse 20 Mo.`); continue; }
    toast(`Envoi de « ${f.name} »…`, 0);
    try {
      let pages = 0;
      try { const doc = await openPdf(await f.arrayBuffer()); pages = doc.numPages; doc.destroy(); } catch(e){}
      const r = await assets.upload(f, {type: "application/pdf"});
      put("pdfs", {id: uid(), deckId: deck.id, folderId: folderForDeck(deck, "Cours"), kind: "pdf", name: f.name.replace(/\.pdf$/i, ""), assetId: r.id, size: r.sizeBytes, pages, created: Date.now()});
      toast(`« ${f.name} » ajouté.`);
    } catch(e){ console.error(e); toast(e && e.code === "quota_exceeded" ? "Espace de stockage plein : supprime d'anciens PDF." : `Envoi de « ${f.name} » impossible. Réessaie.`); }
  }
  render();
}

document.addEventListener("keydown", e => {
  if ($(".scrim") || $("#menu")) return;
  const t = (e.target.tagName || "").toLowerCase();
  if (t === "input" || t === "textarea" || t === "select") return;
  if (view.name !== "study" || !session) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (t === "button" && e.key === "Enter") return;
  if (!session.shown && (e.key === " " || e.key === "Enter")){ e.preventDefault(); reveal(); }
  else if (session.shown && /^[1-4]$/.test(e.key)){ e.preventDefault(); answer(+e.key); }
  else if (session.shown && e.key === " "){ e.preventDefault(); answer(3); }
  else if (e.key.toLowerCase() === "e" && session.card){ e.preventDefault(); editNoteModal(session.card.noteId); }
});

const FX = [
  {l: "Formule", t: "Formule dans le texte : $…$", w: ["$", "$"], cls: "t"},
  {l: "Formule centrée", t: "Formule centrée sur sa ligne : $$…$$", w: ["$$", "$$"], cls: "t"},
  "|",
  {l: "a/b", t: "Fraction", m: "\\frac{#}{}"},
  {l: "√x", t: "Racine carrée", m: "\\sqrt{#}"},
  {l: "xⁿ", t: "Exposant", m: "^{#}"},
  {l: "xₙ", t: "Indice", m: "_{#}"},
  {l: "∫", t: "Intégrale", m: "\\int_{#}^{} "},
  {l: "Σ", t: "Somme", m: "\\sum_{k=#}^{n} "},
  {l: "lim", t: "Limite", m: "\\lim_{x \\to #} "},
  {l: "vec", t: "Vecteur", m: "\\vec{#}"},
  {l: "more", t: "Autres symboles"},
  "|more",
  {l: "α", m: "\\alpha "}, {l: "β", m: "\\beta "}, {l: "θ", m: "\\theta "}, {l: "λ", m: "\\lambda "}, {l: "π", m: "\\pi "}, {l: "ω", m: "\\omega "}, {l: "Δ", m: "\\Delta "},
  {l: "∞", m: "\\infty "}, {l: "≤", m: "\\leq "}, {l: "≥", m: "\\geq "}, {l: "≠", m: "\\neq "}, {l: "→", m: "\\to "}, {l: "⇒", m: "\\Rightarrow "}, {l: "∈", m: "\\in "}, {l: "ℝ", m: "\\mathbb{R}"}, {l: "≈", m: "\\approx "}, {l: "×", m: "\\times "}, {l: "∂", m: "\\partial "},
  {l: "Gras", t: "Texte en gras", w: ["**", "**"], cls: "t"}
];
function fxBar(target){
  let inMore = false, h = "";
  FX.forEach((b, i) => {
    if (b === "|"){ h += `<span class="sep"></span>`; return; }
    if (b === "|more"){ h += `<span class="more" data-more hidden>`; inMore = true; return; }
    if (b.l === "more"){ h += `<button type="button" class="t" data-fxmore title="${b.t}" aria-expanded="false">Symboles ▾</button>`; return; }
    h += `<button type="button" class="${b.cls || ""}" data-fx="${i}" data-target="${target}" title="${esc(b.t || b.m.trim())}">${esc(b.l)}</button>`;
  });
  if (inMore) h += `</span>`;
  return `<div class="fx" role="toolbar" aria-label="Insérer une formule">${h}</div>`;
}
function insideMath(text, pos){
  let inl = false, disp = false;
  for (let i = 0; i < pos; i++){
    if (text[i] === "\\"){ i++; continue; }
    if (text[i] === "$"){ if (text[i + 1] === "$" && !inl){ disp = !disp; i++; } else if (!disp) inl = !inl; }
  }
  return inl || disp;
}
function applyFx(ta, b){
  const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel = v.slice(s, e);
  let ins, caret;
  if (b.w){ ins = b.w[0] + sel + b.w[1]; caret = s + b.w[0].length + sel.length + (sel ? b.w[1].length : 0); }
  else {
    const [pre, post] = b.m.split("#").concat("");
    let body = pre + sel + post, off = pre.length + sel.length;
    if (!insideMath(v, s)){ body = "$" + body + "$"; off += 1; }
    ins = body; caret = s + off;
  }
  ta.focus();
  ta.setRangeText(ins, s, e, "end");
  ta.setSelectionRange(caret, caret);
  ta.dispatchEvent(new Event("input", {bubbles: true}));
}
function bindFx(root, getTa){
  $$("[data-fx]", root).forEach(btn => {
    btn.addEventListener("mousedown", e => e.preventDefault());
    btn.addEventListener("click", () => applyFx(getTa(btn.dataset.target), FX[+btn.dataset.fx]));
  });
  $$("[data-fxmore]", root).forEach(btn => {
    btn.addEventListener("mousedown", e => e.preventDefault());
    btn.addEventListener("click", () => { const more = btn.parentElement.querySelector("[data-more]"); more.hidden = !more.hidden; btn.setAttribute("aria-expanded", !more.hidden); btn.textContent = more.hidden ? "Symboles ▾" : "Symboles ▴"; });
  });
}
async function renderPreview(el, errBox, n){

  if (unclosedDollar(n.front) || unclosedDollar(n.back)) errs.unshift("Un symbole <code>$</code> n'est pas refermé : chaque formule doit commencer et finir par <code>$</code>.");
  errBox.innerHTML = errs.length ? `<p class="math-err">${ic("alert")}<span>${errs.join("<br>")}</span></p>` : "";
}
function previewHTML(n){

function bindNoteForm(root, note){
  const front = $("#nf-front", root), back = $("#nf-back", root);
  const targets = $$("[data-prev]", root).map(el => ({el, err: el.parentElement.querySelector("[data-perr]")}));
  let t = null;
  const upd = () => { clearTimeout(t); t = setTimeout(() => {
    const n = {model: note.model, front: front.value, back: back.value};
    targets.forEach(x => { if (x.el.offsetParent !== null || !targets.some(y => y.el.offsetParent !== null)) renderPreview(x.el, x.err, n); });
  }, 300); };
  const onResize = () => { if (!document.contains(front)) window.removeEventListener("resize", onResize); else upd(); };
  window.addEventListener("resize", onResize);
  bindFx(root, which => which === "back" ? back : front);
  $("#nf-model", root).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    note.model = b.dataset.m;

    const md = MODELS.find(x => x.id === note.model);

    back.placeholder = note.model === "cloze" ? "Facultatif : remarque affichée avec la réponse" : "Si $f$ est continue sur $[a,b]$ et dérivable sur $]a,b[$, il existe $c$ tel que $f(b)-f(a)=f'(c)(b-a)$.";
    upd();
  });
  const mk = () => {
    const s = front.selectionStart, e2 = front.selectionEnd, v = front.value, n = Math.max(0, ...clozeOrds(v)) + 1, open = `{{c${n}::`;
    front.focus(); front.setRangeText(open + v.slice(s, e2) + "}}", s, e2, "end");
    const pos = s + open.length + (e2 - s); front.setSelectionRange(pos, pos); upd();
  };
  $("#nf-cbtn", root).onclick = mk;
  front.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.code === "KeyL"){ e.preventDefault(); if (note.model !== "cloze") $('#nf-model [data-m="cloze"]', root).click(); mk(); } });
  front.addEventListener("input", upd); back.addEventListener("input", upd);
  upd();
  return () => ({model: note.model, front: front.value, back: back.value, deckId: $("#nf-deck", root) ? $("#nf-deck", root).value : note.deckId, tags: $("#nf-tags", root).value.split(/[\s,]+/).filter(Boolean)});
}
function validNote(n){

}

function bars(data, color){
  const W = 680, H = 190, pl = 32, pb = 24, pt = 10, n = data.length;
  const max = Math.max(4, ...data.map(d => d.v)), step = Math.ceil(max / 4), top = step * 4, bw = (W - pl) / n;
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique en barres">`;
  for (let i = 0; i <= 4; i++){ const v = step * i; s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)" stroke-width="1"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; }
  data.forEach((d, i) => {
    const x = pl + i * bw + bw * .2, w = bw * .6;
    if (d.v){ s += `<rect x="${x}" y="${y(d.v)}" width="${w}" height="${y(0) - y(d.v)}" rx="3" fill="${color}"><title>${d.v}</title></rect>`;
      if (d.v2) s += `<rect x="${x}" y="${y(d.v2)}" width="${w}" height="${y(0) - y(d.v2)}" rx="3" fill="var(--again)"><title>${d.v2} à revoir</title></rect>`; }
    if (d.label) s += `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  return s + "</svg>";
}

    let k = 0;

function splitCSV(line, sep){
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++){ const ch = line[i];
    if (q){ if (ch === '"' && line[i + 1] === '"'){ cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"' && !cur) q = true; else if (ch === sep){ out.push(cur); cur = ""; } else cur += ch; }
  out.push(cur); return out;
}

function idb(){
  return new Promise((res, rej) => { const r = indexedDB.open("centrale-files", 1); r.onupgradeneeded = () => r.result.createObjectStore("files", {keyPath: "id"}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

async function idbPut(o){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").put(o); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbDel(id){ const db = await idb(); return new Promise((res) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").delete(id); tx.oncomplete = res; tx.onerror = res; }); }

const localAssets = {
  async upload(blob, opts = {}){
    const id = hex32(), type = opts.type || blob.type || "application/octet-stream";
    const b = blob.type === type ? blob : new Blob([blob], {type});
    try { await idbPut({id, blob: b, type, size: b.size, at: Date.now()}); }
    catch(e){ throw {code: "quota_exceeded", message: "Stockage plein sur cet appareil."}; }
    localUrls[id] = URL.createObjectURL(b);
    return {id, url: localUrls[id], sizeBytes: b.size, contentType: type};
  },
  async delete(id){ await idbDel(id); if (localUrls[id]) URL.revokeObjectURL(localUrls[id]); delete localUrls[id]; },
  async list(){ const all = await idbAll().catch(() => []); return {assets: all.map(a => ({id: a.id, url: localUrls[a.id], sizeBytes: a.size, contentType: a.type})), usage: {bytes: all.reduce((s, a) => s + (a.size || 0), 0)}}; }
};
const localDownloads = {

    const blob = data instanceof Blob ? data : new Blob([data], {type: /\.json$/.test(filename) ? "application/json" : /\.ics$/.test(filename) ? "text/calendar" : "text/plain"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();

const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });
async function geminiJSON(prompt, {signal, images} = {}){

  const parts = [{text: typeof prompt === "string" ? prompt : prompt.map(t => (t.role === "user" ? "" : "ASSISTANT : ") + t.content).join("\n\n")}];
  for (const im of images || []) parts.push({inline_data: {mime_type: im.type || "image/jpeg", data: await blobToB64(im)}});
  const body = JSON.stringify({contents: [{role: "user", parts}], generationConfig: {responseMimeType: "application/json", temperature: 0.2}});
  let lastErr;
  for (const model of ["gemini-2.5-flash", "gemini-flash-latest"]){
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {method: "POST", headers: {"Content-Type": "application/json"}, body, signal});
      if (r.status === 429) throw {code: "rate_limited", message: "Limite gratuite de Gemini atteinte : réessaie dans une minute."};
      if (!r.ok){ lastErr = {code: "http", message: "Gemini a répondu " + r.status}; continue; }
      const j = await r.json(), txt = (((j.candidates || [])[0] || {}).content || {parts: []}).parts.map(p => p.text || "").join("");
      return JSON.parse(txt.replace(/^```(json)?|```$/g, ""));
    } catch(e){ if (e && (e.name === "AbortError")) throw {code: "cancelled"}; if (e && e.code === "rate_limited") throw e; lastErr = e; }
  }
  throw lastErr || {message: "Gemini indisponible."};
}

/* ---- planning automatique (moteur Jarvis) ---- */
const WIN_DEFAULT = () => (JB ? {...JB.DEFAULT_WINDOWS} : {});
const winOf = () => ({...WIN_DEFAULT(), ...(S.meta.windows || {})});

function replanSoon(){ clearTimeout(replanT); replanT = setTimeout(() => { replan(); if (view.name === "plan") renderPlanSide(); else if (view.name === "home") softRender(); }, 250); }
function replan(){
  if (!JB || !S.ready) return null;
  replanning = true;
  try {
    const now = new Date(), today = realToday(), nowM = now.getHours() * 60 + now.getMinutes();
    const blocks = [...S.blocks.values()];
    const doneBy = {}; blocks.forEach(b => { if (b.done && b.taskId) doneBy[b.taskId] = (doneBy[b.taskId] || 0) + Math.max(0, toMin(b.end) - toMin(b.start)); });
    // une tâche dont tout le temps prévu est fait passe en « terminée »
    [...S.tasks.values()].forEach(t => { if (!t.done && t.minutes && (t.doneMin || 0) + (doneBy[t.id] || 0) >= t.minutes && t.time == null) put("tasks", {...t, done: true, doneAt: Date.now()}); });
    const tasks = [...S.tasks.values()].map(t => ({...t, minutes: t.minutes || 60, created: t.createdAt || 0, doneMin: (t.doneMin || 0) + (doneBy[t.id] || 0)}));
    // révisions Centrale : 25 min chaque soir tant qu'il y a des cartes
    if (S.cards.size && S.meta.revDaily !== false) for (let i = 0; i < 7; i++) tasks.push({id: "rev-" + i, title: "Révisions Centrale", subject: "Révisions", minutes: 25, day: isoDay(today + i), part: "tard", created: 0, done: false, doneMin: blocks.some(b => b.done && b.subject === "Révisions" && dayOfIso(b.date) === today + i) ? 25 : 0});
    const busy = [...(S.meta.busy || []), ...AGENDA.filter(e => dayOfIso(e.date) >= today).map(e => ({day: e.date, from: toMin(e.start) - 10, to: toMin(e.end) + (e.end >= "16:00" ? 25 : 10)})), ...blocks.filter(b => b.done && dayOfIso(b.date) >= today).map(b => ({day: b.date, from: toMin(b.start), to: toMin(b.end)}))];
    const P = JB.plan({tasks, busy, settings: {windows: winOf(), maxBlock: S.meta.maxBlock || 90, pause: S.meta.pause ?? 10}}, now, 14);
    // on remplace les créneaux à venir non faits
    blocks.forEach(b => { const d = dayOfIso(b.date); if (!b.done && (d > today || (d === today && toMin(b.end) > nowM))) del("blocks", b.id); });
    P.blocks.forEach(b => {
      const t = tasks.find(x => x.id === b.taskId); if (!t) return;
      put("blocks", {id: uid(), date: b.day, start: hm(b.from), end: hm(Math.min(b.to, 1439)), title: t.title, subject: t.subject === "Révisions" ? "Révisions" : subjA(t.subject), taskId: String(t.id).startsWith("rev-") ? null : t.id, done: false, fixed: !!b.fixed});
    });
    // ménage : créneaux de plus de 14 jours
    [...S.blocks.values()].forEach(b => { if (dayOfIso(b.date) < today - 14) del("blocks", b.id); });
    S.meta = {...S.meta, late: P.late.filter(l => !String(l.taskId).startsWith("rev-"))}; saveMeta();
    return P;
  } finally { replanning = false; }
}

  try { return JSON.parse(t); } catch(e){ const m = t.match(/\{[\s\S]*\}/); if (m) try { return JSON.parse(m[0]); } catch(e2){} }
  return null;
}
async function llmTurn(text){
  const sys = SYS(), hist = histTurns();
  // 1) Gemini si une clé est enregistrée (rapide, quotas larges)
  if (gemKey()){
    try { const prompt = sys + "\n\nCONVERSATION RÉCENTE :\n" + hist.map(h => (h.role === "user" ? "Thomas : " : "Jarvis : ") + h.content).join("\n") + "\n\nTHOMAS : " + text; const r = await geminiJSON(prompt, {}); if (r && (r.say || r.actions)) return r; } catch(e){ console.warn(e); }
  }
  // 2) IA gratuite sans clé (limite : une réponse toutes les 45 s environ)
  if (Date.now() < pollNext) return null;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(POLL, {method: "POST", headers: {"Content-Type": "application/json"}, signal: ctl.signal,
      body: JSON.stringify({model: "openai", messages: [{role: "system", content: sys}, ...hist, {role: "user", content: text}], response_format: {type: "json_object"}})});
    pollNext = Date.now() + 46e3;
    if (r.status === 402 || r.status === 429){ const ra = +r.headers.get("retry-after") || 45; pollNext = Date.now() + ra * 1000; return null; }
    if (!r.ok) return null;
    const j = await r.json(), out = parseJSON(((j.choices || [])[0] || {}).message?.content);
    return out && (out.say || out.actions) ? out : null;
  } catch(e){ console.warn(e); return null; } finally { clearTimeout(timer); }
}
function normActions(list){
  const T = isoDay(realToday());
  const hmS = s => typeof s === "string" && /^\d{1,2}:\d{2}$/.test(s) ? toMin(s) : null;
  const okD = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : null;
  return (Array.isArray(list) ? list : []).map(a => {
    if (!a || typeof a !== "object") return null;
    if (a.op === "add" && a.title) return {op: "add", title: String(a.title).slice(0, 120), subject: a.subject, minutes: Math.max(10, Math.min(900, +a.minutes || 60)), due: okD(a.due), day: okD(a.day), time: hmS(a.time)};
    if (a.op === "busy" && okD(a.day)) return {op: "busy", day: a.day, from: hmS(a.from) ?? 0, to: hmS(a.to) ?? 1440, label: a.label};
    if (["done", "delete", "progress"].includes(a.op) && a.match) return {op: a.op, match: String(a.match), minutes: +a.minutes || 0};
    if (a.op === "move" && okD(a.day) && a.match) return {op: "move", match: String(a.match), day: a.day, time: hmS(a.time)};
    if (a.op === "undo") return {op: "undo"};
    return null;
  }).filter(Boolean);
}
// garde seulement les infos de placement calculées par le planificateur (« Je l'ai mis demain à 18 h »)
function placementOnly(r){
  const out = [];
  String(r || "").split("\n").forEach(l => {
    const t = (l.match(/^C'est noté : (.+?)(?: \(|, )/) || l.match(/^J'ai déplacé « (.+?) »/) || [])[1];
    const m = l.match(/Je l'ai réparti en (\d+) séances : (.+?)(\.|…)( Attention.*)?$/), m1 = l.match(/Je l'ai mis (.+?)\.( Attention.*)?$/);
    if (t && m) out.push(`« ${t} » : ${m[1]} séances, ${m[2]}.${m[4] || ""}`);
    else if (t && m1) out.push(`« ${t} » : ${m1[1]}.${m1[2] || ""}`);
    else if (/^Je n'ai pas trouvé/.test(l)) out.push(l);
  });
  return out.length ? "Au planning : " + out.join(" ") : "";
}
