<!doctype html>
<html lang="fr" data-theme="light" style="color-scheme:light">
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Centrale</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Centrale">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Ccircle cx=%2724%27 cy=%2730%27 r=%279%27 fill=%27none%27 stroke=%27%231f4fb0%27 stroke-width=%274%27/%3E%3Cpath d=%27M24 21 C13 16.5 14 7 32 8.2%27 fill=%27none%27 stroke=%27%231f4fb0%27 stroke-width=%274%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Atelier : fond papier, une seule couleur d'accent (bleu), titres en Instrument Serif, chiffres en JetBrains Mono. */
:root{
  --bg:#f4f4f1; --head:#fbfbf9; --surface:#ffffff; --surface-2:#f7f7f4; --line:#e4e3de; --line-2:#efeee9; --line-3:#d6d4cd;
  --ink:#141414; --ink-2:#5c5a54; --ink-3:#8a8880;
  --accent:#1f4fb0; --accent-2:#163a85; --accent-soft:#e9effb; --accent-line:#d3e0f7; --accent-ink:#ffffff;
  --r1:#dbe6fb; --r2:#9dbcf2; --r3:#4f86e3; --r4:#1f4fb0; --never:#e9e8e3;
  --ok:#2a78d6; --bad:#eb6834; --pos:#1a7a44; --late:#b8461c;
  --new:#2a78d6; --learn:#c8551f; --due:#1a7a44; --warn:#a8741a;
  --again:#c4441f; --hard:#93650f; --good:#1a7a44; --easy:#1f4fb0;
  --again-bg:#fbece5; --hard-bg:#f8f0de; --good-bg:#e5f3ea; --easy-bg:#e9effb;
  --shadow-1:none;
  --shadow-2:0 1px 2px rgba(20,20,20,.04),0 12px 32px -10px rgba(20,20,20,.14);
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-read:"Newsreader",Georgia,"Times New Roman",serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-s:6px; --r:10px; --r-l:16px;
  --s1:#1f4fb0; --s2:#c8551f; --s3:#1a7a44; --s4:#7a4bc4; --s5:#a8741a; --s6:#0e7f92; --s7:#b3366f; --s8:#6b6963;
  --logo:#1f4fb0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211; --head:#161615; --surface:#1b1b1a; --surface-2:#222220; --line:#2e2d2a; --line-2:#262523; --line-3:#3a3936;
  --ink:#ededea; --ink-2:#a9a79f; --ink-3:#7b7972;
  --accent:#8fb0f2; --accent-2:#b1c8f6; --accent-soft:#1c2638; --accent-line:#2a3a58; --accent-ink:#0e1526;
  --r1:#1f2a40; --r2:#2f4f8a; --r3:#4f86e3; --r4:#8fb0f2; --never:#2a2927;
  --ok:#5b9be8; --bad:#f08a5d; --pos:#5cc489; --late:#f0915f;
  --new:#6aa5ef; --learn:#f0915f; --due:#5cc489; --warn:#e0b85c;
  --again:#f0915f; --hard:#e0b85c; --good:#5cc489; --easy:#8fb0f2;
  --again-bg:#3a2219; --hard-bg:#332a17; --good-bg:#183026; --easy-bg:#1c2638;
  --shadow-2:0 1px 2px rgba(0,0,0,.3),0 12px 32px -10px rgba(0,0,0,.55);
  --s1:#8fb0f2; --s2:#f0915f; --s3:#5cc489; --s4:#b996ff; --s5:#e0b85c; --s6:#5ccfe0; --s7:#f08cbc; --s8:#a9a79f;
  --logo:#8fb0f2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211; --head:#161615; --surface:#1b1b1a; --surface-2:#222220; --line:#2e2d2a; --line-2:#262523; --line-3:#3a3936;
  --ink:#ededea; --ink-2:#a9a79f; --ink-3:#7b7972;
  --accent:#8fb0f2; --accent-2:#b1c8f6; --accent-soft:#1c2638; --accent-line:#2a3a58; --accent-ink:#0e1526;
  --r1:#1f2a40; --r2:#2f4f8a; --r3:#4f86e3; --r4:#8fb0f2; --never:#2a2927;
  --ok:#5b9be8; --bad:#f08a5d; --pos:#5cc489; --late:#f0915f;
  --new:#6aa5ef; --learn:#f0915f; --due:#5cc489; --warn:#e0b85c;
  --again:#f0915f; --hard:#e0b85c; --good:#5cc489; --easy:#8fb0f2;
  --again-bg:#3a2219; --hard-bg:#332a17; --good-bg:#183026; --easy-bg:#1c2638;
  --shadow-2:0 1px 2px rgba(0,0,0,.3),0 12px 32px -10px rgba(0,0,0,.55);
  --s1:#8fb0f2; --s2:#f0915f; --s3:#5cc489; --s4:#b996ff; --s5:#e0b85c; --s6:#5ccfe0; --s7:#f08cbc; --s8:#a9a79f;
  --logo:#8fb0f2;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- coque : barre du haut (barre d'onglets en bas sur téléphone) ---------- */
.shell{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:var(--head);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;height:64px;padding:0 40px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;color:var(--ink);font-weight:600;font-size:20px;letter-spacing:-.03em;line-height:1}
.brand svg{width:30px;height:30px;flex:none}
.brand svg *{stroke:var(--logo)}
.nav{display:flex;gap:2px;flex:1;min-width:0}
.nav button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.nav button:hover{color:var(--ink);background:var(--line-2)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--line-2)}
.qs{display:flex;align-items:center;gap:8px;height:38px;width:260px;padding:0 8px 0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink-3)}
.qs:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qs svg{width:16px;height:16px}
.qs input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink);font-size:14px}
.qs kbd{font:11px var(--f-num);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-3)}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.sync span:last-child{max-width:0;overflow:hidden;transition:max-width .2s}
.sync:hover span:last-child{max-width:160px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:#3aa66a} .dot.busy{background:#e0a93a} .dot.off{background:#eb6834}
.main{flex:1;min-width:0}
#app{width:100%;max-width:1320px;margin:0 auto;padding-inline:40px;padding-block:36px 72px}
.tabbar{display:none}
@media (max-width:1100px){.qs{width:200px}.top-in{gap:18px}}
@media (max-width:900px){
  .topbar{top:0;padding-top:env(safe-area-inset-top,0px)}
  .top-in{height:54px;padding:0 16px}
  .topbar .nav,.topbar .qs,.topbar #top-add{display:none}
  .sync{margin-left:auto}
  .sync span:last-child{max-width:160px}
  .brand{font-size:19px}.brand svg{width:27px;height:27px}
  #app{padding-inline:16px;padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--head);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:grid;justify-items:center;gap:2px;border:0;background:none;color:var(--ink-3);font-size:11.5px;font-weight:500;padding:6px 2px;border-radius:8px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  body.studying .tabbar{display:none}
}

/* ---------- typo & éléments ---------- */
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:30px;line-height:1.15;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
@media (max-width:900px){h1{font-size:24px}}
.sub{color:var(--ink-2);margin:6px 0 0;max-width:65ch}
.cap{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.hint{font-size:13px;color:var(--ink-3);margin:0}
.page-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.page-h .grow{flex:1;min-width:220px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-3);margin-bottom:8px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--ink-2)}
.crumbs button:hover{color:var(--accent)}
.crumbs svg{width:14px;height:14px}
code.num{font-size:.88em;background:var(--surface-2);border:1px solid var(--line-2);padding:0 5px;border-radius:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:14.5px;white-space:nowrap;text-decoration:none;box-shadow:var(--shadow-1);transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.quiet:hover{background:var(--line-2);color:var(--ink)}
.btn.danger{color:var(--again)}
.btn.danger.fill{background:var(--again);border-color:var(--again);color:#fff}
.btn.sm{height:32px;padding:0 11px;font-size:13.5px;gap:6px}
.btn.lg{height:48px;padding:0 22px;font-size:15.5px;border-radius:10px}
.btn.icon{width:36px;padding:0}
.btn.sm.icon{width:32px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-1)}
.panel-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-h h2{flex:1}
.panel-b{padding:20px}

/* ---------- résumé du jour ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;display:grid;gap:4px;align-content:start}
.kpi .v{font:600 26px/1.1 var(--f-num);letter-spacing:-.02em}
.kpi .l{font-size:13px;color:var(--ink-2)}
@media (max-width:620px){.kpis{gap:8px}.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:12px}.kpi .v{font-size:20px}.kpi .l{font-size:12px}}

/* ---------- liste de paquets ---------- */
.dl-head,.dl-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 92px 140px;align-items:center;gap:8px;padding:0 16px}
.dl-head{height:44px;border-bottom:1px solid var(--line-2)}
.dl-head span{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;justify-content:flex-end;gap:6px}
.dl-head span:first-child{justify-content:flex-start}
.sw{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dl-row{min-height:58px;border-bottom:1px solid var(--line-2)}
.dl-row:last-child{border-bottom:0}
.dl-row:hover{background:var(--surface-2)}
.dl-name{display:flex;align-items:center;gap:6px;min-width:0}
.dl-name .open{border:0;background:none;padding:8px 0;text-align:left;min-width:0;display:grid;gap:1px}
.dl-name .open b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-name .open small{color:var(--ink-3);font-size:12.5px}
.dl-name .open:hover b{color:var(--accent)}
.chev{width:26px;height:26px;border:0;background:none;border-radius:6px;color:var(--ink-3);display:grid;place-items:center;flex:none;padding:0}
.chev:hover{background:var(--line-2);color:var(--ink)}
.chev svg{width:16px;height:16px;transition:transform .15s}
.chev[aria-expanded="false"] svg{transform:rotate(-90deg)}
.chev-sp{width:26px;flex:none}
.cnt{text-align:right;font:500 15px var(--f-num)}
.cnt.z{color:var(--ink-3);opacity:.45}
.c-new{color:var(--new)} .c-learn{color:var(--learn)} .c-due{color:var(--due)}
.dl-act{display:flex;gap:4px;justify-content:flex-end}
.dl-mob{display:none!important}
@media (max-width:700px){
  .dl-head{display:none}
  .dl-row{grid-template-columns:minmax(0,1fr) auto;padding:4px 8px 4px 6px}
  .dl-row .cnt{display:none}
  .dl-mob{display:flex!important;gap:10px;font:500 13px var(--f-num)}
  .dl-name .open .tot{display:none}
  .dl-act .t{display:none}
  .dl-act .btn.primary{width:36px;padding:0}
}

/* ---------- vide / bienvenue ---------- */
.welcome{padding:40px;display:grid;gap:28px}
.welcome h1{font-size:32px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.step{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start;background:var(--surface-2)}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 13px var(--f-num);display:grid;place-items:center}
.step p{margin:0;color:var(--ink-2);font-size:14px}
@media (max-width:760px){.steps{grid-template-columns:1fr}.welcome{padding:22px}.welcome h1{font-size:25px}.welcome .actions .btn{width:100%}}

/* ---------- page paquet ---------- */
.deck-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.deck-grid{grid-template-columns:1fr}}
.today-panel{padding:24px;display:grid;gap:20px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.tri>div{padding:16px;display:grid;gap:4px;border-right:1px solid var(--line-2)}
.tri>div:last-child{border-right:0}
.tri .v{font:600 30px/1.1 var(--f-num)}
.tri .l{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
@media (max-width:520px){.tri>div{padding:12px 10px}.tri .v{font-size:24px}.tri .l{font-size:12px}}
.done{display:flex;gap:14px;align-items:flex-start}
.done-ic{width:40px;height:40px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;flex:none}
.done-ic svg{width:22px;height:22px;stroke-width:2.2}
.desc{color:var(--ink-2);white-space:pre-wrap;margin:8px 0 0;max-width:70ch}

.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;display:grid;justify-items:center;gap:6px;text-align:center;color:var(--ink-2);background:var(--surface-2);transition:border-color .15s,background .15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:24px;height:24px;color:var(--accent)}
.drop b{color:var(--ink);font-weight:600}
.files{display:grid}
.file{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.file:last-child{border-bottom:0}
.ficon{width:34px;height:42px;border-radius:5px;background:var(--again-bg);color:var(--again);display:grid;place-items:end center;padding-bottom:6px;font:700 9.5px var(--f-num);letter-spacing:.04em}
.fname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{font:12px var(--f-num);color:var(--ink-3)}
.file .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.file{grid-template-columns:auto minmax(0,1fr)}.file .acts{grid-column:1/-1;justify-content:flex-start}}
.chapters .dl-row{grid-template-columns:minmax(0,1fr) 56px 56px 56px auto}
@media (max-width:700px){.chapters .dl-row{grid-template-columns:minmax(0,1fr) auto}}

/* ---------- révision ---------- */
.study{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card,.card-side,.card-body{min-width:0}
.st-top{display:flex;align-items:center;gap:6px}
.st-top .deck{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-counts{display:flex;gap:12px;font:600 15px var(--f-num);margin-right:6px}
.st-counts span{padding-bottom:1px;border-bottom:2px solid transparent}
.st-counts .cur{border-bottom-color:currentColor}
.progress{height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-2);min-height:min(50vh,420px);display:flex;flex-direction:column}
.card-side{padding:26px 34px;display:grid;gap:14px;align-content:start}
.card-side+.card-side{border-top:1px dashed var(--line)}
.card-body{font:400 23px/1.5 var(--f-read);text-align:center;overflow-wrap:anywhere;color:var(--ink)}
.card-side.a .card-body{font-size:21px}
.card-body b{font-weight:600}
.card-body .extra{font-size:17px;color:var(--ink-2);margin-top:14px}
.card-img{display:block;width:auto;max-width:100%;max-height:340px;margin:12px auto;border-radius:10px;background:#fff;border:1px solid var(--line)}
td .card-img,.lee .card-img,.gen-prev .card-img{display:inline-block;max-height:34px;margin:0 4px;vertical-align:middle;border-radius:4px}
.lee .q .card-img{display:none}
@media (max-width:620px){.card-side{padding:20px 18px}.card-body{font-size:19.5px}.card-side.a .card-body{font-size:18px}}
.card mjx-container[display="true"]{margin:.6em 0!important;overflow-x:auto;overflow-y:hidden;max-width:100%}
.cloze{color:var(--accent);font-weight:600}
.cloze-q{color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 6px;font-weight:600}
mjx-container .cloze,mjx-container .cloze-q{color:var(--accent)}
.answer-bar{display:grid;gap:10px}
.reveal{width:100%;height:54px;font-size:16px}
.eases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ease{border:1px solid transparent;border-radius:10px;padding:10px 6px;display:grid;justify-items:center;gap:1px;font-weight:600;font-size:15px}
.ease small{font:500 12.5px var(--f-num);opacity:.85}
.ease.e1{background:var(--again-bg);color:var(--again)} .ease.e2{background:var(--hard-bg);color:var(--hard)}
.ease.e3{background:var(--good-bg);color:var(--good)} .ease.e4{background:var(--easy-bg);color:var(--easy)}
.ease:hover{border-color:currentColor}

.type{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;text-align:left;min-width:0;box-shadow:var(--shadow-1)}

/* courbe */
.plot{position:relative;margin-left:34px}
.plot .gl{position:absolute;left:0;right:0;border-top:1px solid var(--line-2)}
.plot .gl.base{border-top-color:var(--line-3)}
.plot .gy{position:absolute;left:-34px;transform:translateY(-50%);font:11px var(--f-num);color:var(--ink-3)}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plot .now{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-3)}
.plot .pt{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);box-shadow:0 0 0 1px currentColor;background:currentColor}
.plot .tag2{position:absolute;font-size:12px;font-weight:600;background:var(--surface);padding:2px 7px;border-radius:6px;border:1px solid var(--line);white-space:nowrap;transform:translate(-104%,-150%)}
.plot .tag3{position:absolute;right:0;font-size:11px;color:var(--ink-2);white-space:nowrap;transform:translateY(-150%);background:var(--surface);padding:0 4px}
.plot .ov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--ink-3);padding:0 20px}
.gx{display:flex;justify-content:space-between;margin-left:34px;font:11px var(--f-num);color:var(--ink-3)}

/* barres */
.cols{position:relative;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--line-3)}
.cols>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0}
.cols .bl{font:10px var(--f-num);color:var(--ink-2)}
.cols .b{width:100%;border-radius:4px 4px 0 0;background:var(--r3)}
.cols .b.t{background:var(--r4)}
.cols>.avg{position:absolute;left:0;right:0;height:0;flex:none;border-top:1px dashed var(--line-3)}
.cols .avg span{position:absolute;right:0;transform:translateY(-110%);font-size:11px;color:var(--ink-2);background:var(--surface);padding-left:4px}
.cols.thin{gap:3px}
.cols.thin>div{gap:2px}
.cols .ok{width:100%;background:var(--ok)}
.cols .ko{width:100%;background:var(--bad);border-radius:2px 2px 0 0}
.cols .ok:first-child{border-radius:2px 2px 0 0}
.xl{display:flex;gap:5px;font:10px var(--f-num);color:var(--ink-3)}
.xl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.xl.sb{justify-content:space-between}
.xl.sb span{flex:none}

/* maîtrise */
.mt{display:flex;flex-direction:column}
.mt-h,.mt-r{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 58px 72px;gap:14px;align-items:center}
.mt-h{padding:0 0 8px;font-size:11px;color:var(--ink-3);border-bottom:1px solid var(--line-2)}
.mt-h span:nth-child(n+3),.mt-r>span:nth-child(n+3){text-align:right}
.mt-r{padding:10px 0;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;color:var(--ink);width:100%}
.mt-r:last-child{border-bottom:0}
.mt-r:hover .nm{color:var(--accent)}
.mt-r .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.mt-r .nm small{font:11px var(--f-num);color:var(--ink-3);margin-right:8px}
.stk{display:flex;gap:2px;height:12px;border-radius:3px;overflow:hidden;background:var(--never)}
.stk span{flex:none}
.mt-r .p{font:12px var(--f-num)}
.mt-r .d{font-size:12px;color:var(--ink-3)}
.mt-r .d.late{color:var(--late);font-weight:600}
.mt-r .d.go{color:var(--ink)}

/* régularité */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--surface-2);border-radius:10px;min-width:0}
.trio b{font:400 26px/1.1 var(--f-disp)}
.trio span{font-size:12px;color:var(--ink-2)}
.heat{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px}
.heat .dl{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font:10px var(--f-num);color:var(--ink-3);align-items:center}
.heat .hg{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.heat .hg span{aspect-ratio:1;border-radius:4px;background:var(--line-2);max-height:20px}
.heat .hg span.f{background:transparent}
.heat .hg span.t{box-shadow:0 0 0 1.5px var(--ink)}
.heat .ml{grid-column:2;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;font:10px var(--f-num);color:var(--ink-3);white-space:nowrap}
.hk{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--ink-3)}
.hk i{width:11px;height:11px;border-radius:3px}

/* listes */
.li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;color:var(--ink);width:100%}
.li:hover .nm{color:var(--accent)}
.li>i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.li .nm{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{display:block;font-size:12px;color:var(--ink-2)}
.li .p{font:12px var(--f-num);color:var(--ink-2)}
.lee{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:10px 0;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;color:var(--ink);width:100%}
.lee:hover .q{color:var(--accent)}
.lee .q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.lee .q mjx-container{display:inline-block!important;margin:0!important;vertical-align:middle}
.lee .q br{display:none}
.lee .dots{display:flex;gap:3px;align-items:center}
.lee .dots i{width:7px;height:7px;border-radius:50%;background:var(--bad)}
.lee small{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lee small:last-child{text-align:right}

@media (max-width:1180px){
  .d-hero{grid-template-columns:minmax(0,1fr) 340px}
  .d-row.r4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .d-row.r4>.box:last-child{grid-column:1/-1}
}
@media (max-width:1000px){
  .d-hero,.d-row.r2,.d-row.r3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .d-row.r4{grid-template-columns:minmax(0,1fr)}
  .d-hello h1{font-size:38px}
  .kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ks{padding:14px 16px}
  .ks:nth-child(2){border-right:0}
  .ks:nth-child(-n+2){border-bottom:1px solid var(--line-2)}
  .ks .v{font-size:32px}
  .box{padding:18px}
  .sess{padding:20px}
  .sess-n b{font-size:64px}
  .mt-h,.mt-r{grid-template-columns:minmax(0,1fr) 84px 44px;gap:10px}
  .mt-h span:nth-child(4),.mt-r>span:nth-child(4){display:none}
  .dash{gap:16px}
  .plot .tag3{display:none}
}

/* ---------- assistant ---------- */
.plan-g{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
.asst{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;height:calc(100vh - 140px);min-height:520px}
.orb-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 4px}
.orb{position:relative;width:112px;height:112px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 30px -10px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .15s}
.orb:hover{transform:scale(1.03)} .orb:active{transform:scale(.97)}
.orb .core{position:relative;z-index:2;display:grid;place-items:center}
.orb .core svg{width:38px;height:38px;stroke-width:1.9}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none}
.orb[data-s="listening"]{background:var(--late)}
.orb[data-s="listening"] .ring{border-color:var(--late);animation:ring 1.6s ease-out infinite}
.orb[data-s="listening"] .r2{animation-delay:.8s}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.65);opacity:0}}
.orb .bars{position:absolute;z-index:2;display:none;gap:5px;align-items:center;height:40px}
.orb .bars i{width:5px;border-radius:3px;background:currentColor;animation:bar 1s ease-in-out infinite}
.orb .bars i:nth-child(2){animation-delay:.15s}.orb .bars i:nth-child(3){animation-delay:.3s}.orb .bars i:nth-child(4){animation-delay:.45s}.orb .bars i:nth-child(5){animation-delay:.6s}
@keyframes bar{0%,100%{height:8px}50%{height:34px}}
.orb[data-s="speaking"] .core{display:none}.orb[data-s="speaking"] .bars{display:flex}
.orb[data-s="thinking"] .core{animation:think 1.1s linear infinite}
.orb[data-s="thinking"]{background:var(--accent-2)}
@keyframes think{to{transform:rotate(360deg)}}
.orb[data-s="thinking"] .core svg{display:none}
.orb[data-s="thinking"] .core::before{content:"";width:34px;height:34px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent}
@media (prefers-reduced-motion:reduce){.orb .ring,.orb .bars i,.orb[data-s="thinking"] .core{animation:none}}
.orb-l{font-size:13px;color:var(--ink-2)}
.a-live{margin:0;max-width:100%;text-align:center;font:400 19px/1.4 var(--f-read);color:var(--ink);min-height:1.4em}
.a-log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px;border-top:1px solid var(--line-2);padding-top:14px}
.msg{max-width:88%;display:flex;flex-direction:column;gap:3px}
.msg p{margin:0;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.5}
.msg.me{align-self:flex-end}.msg.me p{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai p{background:var(--surface-2);border:1px solid var(--line-2);border-bottom-left-radius:4px}
.msg.sys p{background:var(--hard-bg);color:var(--ink);font-size:13.5px}
.msg .who{font-size:11px;color:var(--ink-3);padding-left:4px}
.a-hint{font-size:13.5px;color:var(--ink-2)}
.a-hint p{margin:0 0 6px}.a-hint ul{margin:0;padding-left:18px;display:grid;gap:5px}
.a-form{display:flex;gap:8px;align-items:flex-end}
.a-form textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font:15px/1.45 var(--f-ui);max-height:160px;outline:0}
.a-form textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.a-form .btn{height:42px;width:42px;border-radius:12px}
.plan-side{display:flex;flex-direction:column;gap:24px;min-width:0}
.pdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pday{border:1px solid var(--line-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2);min-width:0}
.pday.is-today{border-color:var(--accent-line);background:var(--accent-soft)}
.pday-h{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.pday-h b{font-size:14px}.pday-h span{font-size:12px;color:var(--ink-3)}.pday-h em{margin-left:auto;font-style:normal;font-size:11px;color:var(--ink-3)}
.pdue{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--late);font-weight:600}
.pdue svg{width:14px;height:14px}
.pempty{margin:0;font-size:12.5px;color:var(--ink-3)}
.blk{display:grid;grid-template-columns:22px 44px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 8px;background:var(--surface);border:1px solid var(--line-2);border-left:3px solid var(--c);border-radius:8px}
.blk.now{box-shadow:0 0 0 2px var(--accent-line)}
.blk.crs{background:var(--surface-2);border-color:var(--line-2);border-left-color:var(--c)}.blk.crs .nm{font-weight:500}.blk.crs.colle,.blk.crs.ds{background:var(--accent-soft)}.blk.crs .tag2{font-size:10.5px;font-family:var(--f-num);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.edt{display:flex;flex-direction:column;gap:6px}.edt .row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--surface-2);border-left:3px solid var(--c)}.edt .row.colle,.edt .row.ds{background:var(--accent-soft)}.edt .row.past{opacity:.5}.edt .row.now{box-shadow:0 0 0 2px var(--accent-line)}.edt .t{font-size:12.5px;color:var(--ink-2);white-space:nowrap}.edt .nm{font-size:14px;font-weight:500}
.blk.past:not(.done){opacity:.6}
.blk.done .nm{text-decoration:line-through;color:var(--ink-3)}
.blk .t{font-size:12px;display:flex;flex-direction:column;line-height:1.2}.blk .t small{color:var(--ink-3);font-size:11px}
.blk .nm{font-size:13.5px;font-weight:500;line-height:1.3;min-width:0;overflow-wrap:break-word;hyphens:auto}
.blk .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-3);background:var(--surface);display:grid;place-items:center;padding:0;color:#fff}
.chk svg{width:13px;height:13px;stroke-width:3}
.done>.chk,.trow.done .chk,.blk.done .chk{background:var(--pos);border-color:var(--pos)}
.x{border:0;background:none;color:var(--ink-3);padding:3px;border-radius:6px;display:grid;place-items:center;opacity:0;transition:opacity .12s}
.x svg{width:14px;height:14px}
.blk:hover .x,.trow:hover .x,.x:focus-visible{opacity:1}
@media (hover:none){.x{opacity:1}}
.tlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.trow:first-child{border-top:0}
.trow .nm{font-size:14.5px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.trow .nm small{display:flex;align-items:center;gap:6px;font-weight:400;font-size:12px;color:var(--ink-2);margin-top:2px}
.trow .nm small i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.trow .due{font-size:12px;color:var(--ink-2);white-space:nowrap}
.trow .due .late{color:var(--late);font-weight:600}
.trow.done .nm{text-decoration:line-through;color:var(--ink-3)}
.tdone{margin-top:6px}.tdone summary{cursor:pointer;font-size:13px;color:var(--ink-2);padding:6px 0}
@media (max-width:1000px){.plan-g{grid-template-columns:minmax(0,1fr)}.asst{position:static;height:auto;min-height:0}.a-log{max-height:46vh}}
@media (max-width:620px){.orb{width:96px;height:96px}.pdays{grid-template-columns:minmax(0,1fr)}}

/* fenêtre vocale + statut agenda */
.vw{min-height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px 18px 16px;max-width:520px;margin:0 auto}
.vw-h{display:flex;align-items:center;justify-content:space-between}
.vw-h .brand svg{width:24px;height:24px}
.vw-t{font-size:13px;color:var(--ink-2)}
.vw .a-log{flex:1;max-height:none}
.voice-tip{display:flex;gap:14px;padding:16px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:14px;line-height:1.5}
.voice-tip p{margin:4px 0 0;color:var(--ink-2)}
.vt-ic{width:40px;height:40px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.vt-ic svg{width:20px;height:20px}
.vw-c{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.gc{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2);white-space:nowrap}
.gc svg{width:15px;height:15px}
.gc.ok{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 35%,var(--line))}
.gc.warn{color:var(--late)}
.gc.off{border-style:dashed}
.blk .g{font-size:10px;color:var(--ink-3)}
.extra-study{border-top:1px solid var(--line-2);padding-top:14px}

// Lacunes {{c1::réponse::indice}} lues en tenant compte des accolades LaTeX
function parseCloze(text){
  const out = []; let i = 0, buf = "";
  const re = /\{\{c(\d+)::/g;
  while (i < text.length){
    re.lastIndex = i; const m = re.exec(text);
    if (!m){ buf += text.slice(i); break; }
    buf += text.slice(i, m.index);
    let j = m.index + m[0].length, d = 0, end = -1;
    while (j < text.length){
      if (d === 0 && text.startsWith("}}", j)){ end = j; break; }
      if (text[j] === "\\"){ j += 2; continue; }
      if (text[j] === "{") d++; else if (text[j] === "}") d--;
      j++;
    }
    if (end < 0){ buf += text.slice(m.index); break; }
    if (buf){ out.push({t: "txt", s: buf}); buf = ""; }
    let inner = text.slice(m.index + m[0].length, end), hint = "", dd = 0, cut = -1;
    for (let k = 0; k < inner.length; k++){ if (inner[k] === "\\"){ k++; continue; } if (inner[k] === "{") dd++; else if (inner[k] === "}") dd--; else if (dd === 0 && inner.startsWith("::", k)) cut = k; }
    if (cut >= 0){ hint = inner.slice(cut + 2); inner = inner.slice(0, cut); }
    out.push({t: "cz", n: +m[1], ans: inner, hint});
    i = end + 2;
  }
  if (buf) out.push({t: "txt", s: buf});
  return out;
}
const clozeOrds = text => [...new Set(parseCloze(text).filter(x => x.t === "cz").map(x => x.n))].sort((a, b) => a - b);
const clozePlain = text => parseCloze(text).map(x => x.t === "txt" ? x.s : x.ans).join("");

const MATH_RE = /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$(?:\\.|[^$\\\n])+?\$)/g;
// Marqueurs internes : \u0001…\u0002 = réponse surlignée ; \u0003indice\u0004 = lacune masquée
function toHTML(src){
  const maths = [];
  const txt = String(src).split(MATH_RE).map((seg, i) => {
    if (i % 2 === 1){
      const tex = seg.replace(/\u0001/g, "\\class{cloze}{").replace(/\u0002/g, "}")
        .replace(/\u0003([\s\S]*?)\u0004/g, (m, h) => h ? `\\class{cloze-q}{[\\text{${h.replace(/[{}\\$]/g, "")}}]}` : "\\class{cloze-q}{[\\ldots]}");
      maths.push(esc(tex)); return "\u0005" + (maths.length - 1) + "\u0006";
    }
    return seg;
  }).join("");
  return esc(txt).replace(/\[\[img:([0-9a-f]{32})(?:\|([^\]\n]*))?\]\]\n?/g, (m, id, alt) => `<img class="card-img" src="${blobUrl(id)}" alt="${alt || "Schéma"}" loading="lazy">`)
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/\u0001/g, '<span class="cloze">').replace(/\u0002/g, "</span>")
    .replace(/\u0003([\s\S]*?)\u0004/g, (m, h) => `<span class="cloze-q">[${h || "…"}]</span>`)
    .replace(/\n/g, "<br>")
    .replace(/\u0005(\d+)\u0006/g, (m, k) => maths[+k]);
}
function clozeSide(text, ord, side){
  return toHTML(parseCloze(text).map(x => x.t === "txt" ? x.s : x.n !== ord ? x.ans : side === "q" ? "\u0003" + x.hint + "\u0004" : "\u0001" + x.ans + "\u0002").join(""));
}
function cardFaces(card, noteOverride){
  const note = noteOverride || S.notes.get(card.noteId);
  if (!note) return {q: "<em>Note introuvable</em>", a: ""};
  if (note.model === "cloze"){
    const ord = card.ord || clozeOrds(note.front)[0] || 1;
    return {q: clozeSide(note.front, ord, "q"), a: clozeSide(note.front, ord, "a") + (note.back && note.back.trim() ? `<div class="extra">${toHTML(note.back)}</div>` : ""), cloze: true};
  }
  const [f, b] = card.ord === 1 ? [note.back, note.front] : [note.front, note.back];
  return {q: toHTML(f || ""), a: toHTML(b || "")};
}

/* ================= planification (réglages par défaut d'Anki) ================= */
const STEPS = [1*MIN, 10*MIN], RELEARN = [10*MIN];
const GRAD_IVL = 1, EASY_IVL = 4, HARD_F = 1.2, EASY_BONUS = 1.3, MIN_EASE = 1.3;
function schedule(card, ease, now = Date.now()){
  const c = {...card}, today = dayNum(now);
  const toReview = ivl => { c.state = 2; c.ivl = Math.min(36500, Math.max(1, Math.round(ivl))); c.dueDay = today + c.ivl; c.due = 0; c.step = 0; };
  c.reps = (c.reps || 0) + 1;
  if (c.state === 0 || c.state === 1){
    const i = c.state === 0 ? 0 : (c.step || 0); c.state = 1;
    if (ease === 1){ c.step = 0; c.due = now + STEPS[0]; }
    else if (ease === 2){ c.step = i; c.due = now + (i === 0 && STEPS.length > 1 ? (STEPS[0] + STEPS[1]) / 2 : STEPS[i]); }
    else if (ease === 3){ if (i + 1 < STEPS.length){ c.step = i + 1; c.due = now + STEPS[i + 1]; } else toReview(GRAD_IVL); }
    else toReview(EASY_IVL);
  } else if (c.state === 3){
    const i = c.step || 0;
    if (ease === 1){ c.step = 0; c.due = now + RELEARN[0]; }
    else if (ease === 2) c.due = now + RELEARN[i];
    else if (ease === 3){ if (i + 1 < RELEARN.length){ c.step = i + 1; c.due = now + RELEARN[i + 1]; } else toReview(c.ivl || 1); }
    else toReview((c.ivl || 1) + 1);
  } else {
    const delay = Math.max(0, today - (c.dueDay ?? today)), ivl = c.ivl || 1, e = c.ease || 2.5;
    if (ease === 1){ c.lapses = (c.lapses || 0) + 1; c.ease = Math.max(MIN_EASE, e - .2); c.ivl = 1; c.state = 3; c.step = 0; c.due = now + RELEARN[0]; }
    else {
      const hard = Math.max(ivl + 1, ivl * HARD_F), good = Math.max(hard + 1, (ivl + delay / 2) * e), easy = Math.max(good + 1, (ivl + delay) * e * EASY_BONUS);
      if (ease === 2){ c.ease = Math.max(MIN_EASE, e - .15); toReview(hard); }
      if (ease === 3) toReview(good);
      if (ease === 4){ c.ease = e + .15; toReview(easy); }
    }
  }
  return c;
}
function ivlLabel(card, ease){ const now = Date.now(), c = schedule(card, ease, now); return c.state === 2 ? fmtIvl(c.ivl * DAY) : fmtIvl(c.due - now); }

/* ================= files de révision ================= */
function deckCounts(deck, now = Date.now()){
  const ids = subtreeIds(deck), today = dayNum(now), conf = Object.assign({}, DEFAULT_CONF, deck.conf);
  let nw = 0, l = 0, r = 0, nDone = 0, rDone = 0, total = 0;
  for (const c of S.cards.values()){
    if (!ids.has(c.deckId)) continue;
    total++; if (c.susp) continue;
    if (c.firstDay === today) nDone++;
    if (c.revDay === today) rDone++;
    if (c.state === 0) nw++;
    else if (c.state === 1 || c.state === 3){ if (c.due <= now + 20*MIN) l++; }
    else if (c.dueDay <= today) r++;
  }
  return {n: Math.max(0, Math.min(nw, conf.newPerDay - nDone)), l, r: Math.max(0, Math.min(r, conf.revPerDay - rDone)), total};
}
function buildQueue(deck, now = Date.now()){
  const ids = subtreeIds(deck), today = dayNum(now), k = deckCounts(deck, now);
  const learn = [], rev = [], nw = [];
  for (const c of S.cards.values()){
    if (!ids.has(c.deckId) || c.susp) continue;
    if (c.state === 0) nw.push(c); else if (c.state === 1 || c.state === 3) learn.push(c); else if (c.dueDay <= today) rev.push(c);
  }
  nw.sort((a, b) => a.due - b.due); rev.sort((a, b) => a.dueDay - b.dueDay || (a.id < b.id ? -1 : 1)); learn.sort((a, b) => a.due - b.due);
  return {learn, rev: rev.slice(0, k.r), nw: nw.slice(0, k.n)};
}
function pickNext(q, ses){
  const now = Date.now(), dl = q.learn.filter(c => c.due <= now);
  if (dl.length) return dl[0];
  const r = q.rev.length, n = q.nw.length;
  if (r && n) return ses.sinceNew >= r / n ? q.nw[0] : q.rev[0];
  if (r) return q.rev[0];
  if (n) return q.nw[0];
  return q.learn.find(c => c.due <= now + 20*MIN) || null;
}

  let best = 0, run = 0, prev = null;
  ns.forEach(n => { run = prev !== null && n === prev + 1 ? run + 1 : 1; best = Math.max(best, run); prev = n; });
  return best;
}
function fmtDur(ms){ const m = Math.round(ms / MIN); if (m < 60) return m + " min"; const h = Math.floor(m / 60), r = m % 60; return h + " h" + (r ? " " + String(r).padStart(2, "0") : ""); }
const niceMax = v => { if (v <= 4) return 4; const p = 10 ** Math.floor(Math.log10(v)), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };
const pctW = (a, t) => (t ? a / t * 100 : 0).toFixed(2) + "%";
const tri = (up) => `<svg viewBox="0 0 10 10" aria-hidden="true"><path d="${up ? "M5 1 9 8H1z" : "M5 9 9 2H1z"}" fill="currentColor"/></svg>`;
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);
function cardQuestion(c){
  const n = S.notes.get(c.noteId); if (!n) return "";
  return n.model === "cloze" ? clozePlain(n.front) : c.ord === 1 ? n.back : n.front;
}

function renderDashboard(){
  if (!S.decks.size){ renderDecks(); return; }
  const now = Date.now(), today = dayNum(now), cards = [...S.cards.values()].filter(c => !c.susp);
  const total = cards.length, k = allCounts(now), todo = k.n + k.l + k.r;

  /* --- répartition des cartes --- */
  let mature = 0, young = 0, learning = 0, fresh = 0;
  cards.forEach(c => { if (c.state === 0) fresh++; else if (c.state === 2){ if (c.ivl >= 21) mature++; else young++; } else learning++; });

  /* --- 30 et 7 derniers jours --- */
  const last30 = Array.from({length: 30}, (_, i) => { const d = today - 29 + i, v = dayAt(d) || {}; return {d, n: v.n || 0, again: v.again || 0, ms: v.ms || 0}; });
  const n30 = last30.reduce((s, x) => s + x.n, 0), a30 = last30.reduce((s, x) => s + x.again, 0), ms30 = last30.reduce((s, x) => s + x.ms, 0);
  const ret = n30 ? Math.round((1 - a30 / n30) * 100) : null;
  const half = arr => { const n = arr.reduce((s, x) => s + x.n, 0), a = arr.reduce((s, x) => s + x.again, 0); return n >= 10 ? (1 - a / n) * 100 : null; };
  const h1 = half(last30.slice(0, 15)), h2 = half(last30.slice(15));
  const retDelta = h1 !== null && h2 !== null ? Math.round(h2 - h1) : null;
  const sparkPts = [];
  last30.forEach((x, i) => { const w = last30.slice(Math.max(0, i - 6), i + 1), n = w.reduce((s, y) => s + y.n, 0), a = w.reduce((s, y) => s + y.again, 0); if (n >= 5) sparkPts.push([i, (1 - a / n) * 100]); });
  let spark = "";
  if (sparkPts.length >= 2){
    const lo = Math.min(...sparkPts.map(p => p[1])) - 4, hi = 100, X = i => (i / 29 * 160).toFixed(1), Y = v => (24 - (v - lo) / (hi - lo) * 22).toFixed(1);

    spark = `<svg class="spark" viewBox="0 0 160 26" preserveAspectRatio="none" role="img" aria-label="Réussite sur 7 jours glissants"><path d="${line} L${X(sparkPts.at(-1)[0])} 26 L${X(sparkPts[0][0])} 26Z" fill="var(--r4)" fill-opacity=".08"/><path d="${line}" fill="none" stroke="var(--r4)" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
  } else spark = `<svg class="spark" viewBox="0 0 160 26" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20 L160 20" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/></svg>`;
  const week = last30.slice(-7), prevWeek = last30.slice(-14, -7);
  const msW = week.reduce((s, x) => s + x.ms, 0), msP = prevWeek.reduce((s, x) => s + x.ms, 0), maxMs = Math.max(1, ...week.map(x => x.ms));
  const curStreak = streak(), record = Math.max(bestStreak(), curStreak);
  const avgMs = n30 >= 10 ? ms30 / n30 : 10e3;
  const everN = Object.values(S.meta.days || {}).reduce((s, v) => s + ((v && v.n) || 0), 0);

  /* --- session du jour : regroupée par chapitre --- */
  const q = allQueue(now), byDeck = new Map();
  [...q.learn.filter(c => c.due <= now + 20*MIN), ...q.rev, ...q.nw].forEach(c => byDeck.set(c.deckId, (byDeck.get(c.deckId) || 0) + 1));
  const plan = [...byDeck.entries()].filter(([id]) => S.decks.has(id)).sort((a, b) => b[1] - a[1]);
  const estMin = Math.max(1, Math.round(todo * avgMs / MIN));

  cards.forEach(c => { if (c.state === 2 && c.dueDay < today) overdue.set(c.deckId, (overdue.get(c.deckId) || 0) + 1); });
  const worst = [...overdue.entries()].filter(([id]) => S.decks.has(id)).sort((a, b) => b[1] - a[1])[0];
  const newRate = topDecks().reduce((s, d) => s + Object.assign({}, DEFAULT_CONF, d.conf).newPerDay, 0);

  cards.forEach(c => { if (c.state === 2){ const i = Math.max(0, c.dueDay - today); if (i < 14) fc[i].v++; } else if (c.state === 1 || c.state === 3) fc[0].v++; });
  const fcMax = Math.max(...fc.map(x => x.v)), fcTop = niceMax(Math.max(fcMax, 1)), fcAvg = fc.reduce((s, x) => s + x.v, 0) / 14;

  const said = [];

    <div class="gx">${[from, from + 20, from + 40, today, to].map((d, i) => `<span>${i === 3 ? "auj." : fmtDate(d, {day: "numeric", month: "short"})}</span>`).join("")}</div>`;

const SUBJECTS_A = ["Maths", "Physique", "Chimie", "SI", "Français", "Anglais", "Info", "TIPE", "Autre"];
const SUBJ_COLOR = {Maths: "var(--s1)", Physique: "var(--s2)", Chimie: "var(--s3)", SI: "var(--s4)", "Français": "var(--s5)", Anglais: "var(--s6)", Info: "var(--s7)", TIPE: "var(--s4)", "Révisions": "var(--accent)", Autre: "var(--s8)"};
const asst = {state: "idle", log: [], interim: "", rec: null, heard: "", silenceT: null, ctl: null, micBlocked: false, voice: null, filter: "todo"};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const hm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const toMin = s => { const [h, m] = String(s || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const isoDay = n => dayKey(n);
const dayOfIso = s => Math.round(Date.parse(s) / DAY);

/* ---------- voix (synthèse) ---------- */
function pickVoice(){
  if (!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^fr(-|_|$)/i.test(v.lang));
  const pref = ["Google français", "Amélie", "Audrey", "Thomas", "Marie", "Aurélie", "Microsoft Denise", "Microsoft Henri"];
  for (const p of pref){ const v = vs.find(v => v.name.includes(p)); if (v) return v; }
  return vs.find(v => /fr-FR/i.test(v.lang)) || vs[0] || null;
}
if ("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = () => { asst.voice = pickVoice(); }; asst.voice = pickVoice(); }
function speak(text){
  if (!speakOn() || !("speechSynthesis" in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g, ""));
    u.lang = "fr-FR"; if (asst.voice || (asst.voice = pickVoice())) u.voice = asst.voice;
    u.rate = 1.04;
    u.onstart = () => setAState("speaking"); u.onend = u.onerror = () => { if (asst.state === "speaking") setAState("idle"); };
    speechSynthesis.speak(u);
  } catch(e){ console.error(e); }
}
function stopSpeaking(){ try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch(e){} }

/* ---------- micro (reconnaissance) ---------- */
function micToggle(){
  stopSpeaking();
  if (voiceLinked()){ try { voiceWin.focus(); } catch(e){} return; }
  if (asst.state === "listening" && asst.rec){ finishListening(); return; }
  if (asst.state === "thinking") return;
  if (inFrame && (micAllowedHere() === false || asst.micBlocked || S.meta.voiceMode === "fenetre" || !SR)){
    if (S.meta.voiceMode === "dictee"){ dictateMode(); return; }
    openVoiceWindow(); return;
  }
  if (!SR){ dictateMode(); return; }
  try {
    const r = new SR(); asst.rec = r; asst.heard = ""; asst.interim = "";
    r.lang = "fr-FR"; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onresult = e => {
      let fin = "", tmp = "";
      for (let i = 0; i < e.results.length; i++){ const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else tmp += t; }
      asst.heard = fin; asst.interim = (fin + " " + tmp).trim(); paintLive();
      clearTimeout(asst.silenceT); asst.silenceT = setTimeout(finishListening, 2600);
    };
    r.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture"){ asst.micBlocked = true; asst.rec = null; setAState("idle"); diag({step: "inframe", ok: false, err: e.error});
        asst.log.push({who: "sys", text: e.error === "service-not-allowed" ? "La reconnaissance vocale est désactivée sur cet appareil. Sur Mac : Réglages Système › Clavier › Dictée › Activer. Sur iPhone : Réglages › Général › Clavier › Activer la dictée. En attendant, écris ou dicte dans la zone de texte." : e.error === "audio-capture" ? "Aucun micro détecté. Écris ta demande dans la zone de texte." : "Le micro est refusé pour ce site. Autorise-le (Safari : Réglages du site › Micro › Autoriser), puis touche à nouveau le bouton."}); asst.micBlocked = false; paintLog(); }
      else if (e.error === "no-speech"){ toast("Je n'ai rien entendu. Réessaie en parlant un peu plus fort."); }
      else if (e.error === "network"){ toast("La reconnaissance vocale a besoin d'internet."); }
    };
    r.onend = () => { if (asst.rec === r){ asst.rec = null; const txt = (asst.interim || asst.heard).trim(); asst.interim = ""; if (txt) sendToAssistant(txt); else setAState("idle"); } };
    r.start(); setAState("listening");
    asst.silenceT = setTimeout(() => { if (asst.state === "listening" && !asst.interim) finishListening(); }, 8000);
  } catch(e){ console.error(e); micHelp("blocked"); }
}
function finishListening(){ clearTimeout(asst.silenceT); const r = asst.rec; if (r){ try { r.stop(); } catch(e){} } else setAState("idle"); }
function micHelp(kind){
  const mac = /Mac/.test(navigator.platform || navigator.userAgent), ios = /iPhone|iPad/.test(navigator.userAgent);
  const tip = ios ? "touche le micro du clavier, puis parle" : mac ? "appuie deux fois sur la touche Fn (ou 🌐), puis parle" : "utilise la dictée de ton système";
  asst.log.push({who: "sys", text: kind === "unsupported"
    ? `Ce navigateur ne propose pas la reconnaissance vocale. Pour me parler quand même, clique dans la zone de texte et ${tip} : le texte s'écrit tout seul.`
    : `Le micro est bloqué dans cette page. Autorise-le (icône du micro ou du cadenas dans la barre d'adresse), ou clique dans la zone de texte et ${tip}.`});
  if (view.name === "plan"){ paintLog(); const t = $("#a-in"); if (t) t.focus(); }
}

  const tip = ios ? "touche le micro du clavier" : mac ? "appuie deux fois sur Fn (ou 🌐)" : "lance la dictée de ton système";

const ORB_TEXT = {get idle(){ return asst.micBlocked ? "Touche, puis dicte" : "Touche pour parler"; }, listening: "Je t'écoute…", thinking: "Je prépare ton planning…", speaking: "Touche pour m'interrompre"};
function paintLive(){ const el = $("#a-live"); if (!el) return; el.textContent = asst.state === "listening" ? (asst.interim || "Dis-moi ce que tu as à faire…") : ""; el.hidden = asst.state !== "listening"; }
function paintLog(){

}

function applyAssistant(res){
  const today = realToday(), newIds = [];
  const clean = s => String(s || "").trim().slice(0, 140);
  const subj = s => SUBJECTS_A.includes(s) || s === "Révisions" ? s : "Autre";
  const dueOk = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "") ? s : null;
  (Array.isArray(res.ops) ? res.ops : []).forEach(op => {
    if (!op || typeof op !== "object") return;
    if (op.op === "add" && clean(op.title)){
      const t = {id: uid(), title: clean(op.title), subject: subj(op.subject), due: dueOk(op.due), minutes: Math.max(0, Math.min(2000, +op.minutes || 0)) || null, priority: ["haute", "normale", "basse"].includes(op.priority) ? op.priority : "normale", done: false, createdAt: Date.now()};
      put("tasks", t); newIds.push(t.id);
    } else if (S.tasks.has(op.id)){
      const t = S.tasks.get(op.id);
      if (op.op === "remove") del("tasks", t.id);
      else if (op.op === "done") put("tasks", {...t, done: true, doneAt: Date.now()});
      else if (op.op === "update"){ const u = {...t}; if (op.title) u.title = clean(op.title); if (op.subject) u.subject = subj(op.subject); if ("due" in op) u.due = dueOk(op.due); if (op.minutes) u.minutes = +op.minutes || u.minutes; if (op.priority) u.priority = op.priority; if ("done" in op) u.done = !!op.done; put("tasks", u); }
    }
  });
  if (Array.isArray(res.planning)){
    [...S.blocks.values()].forEach(b => { if (dayOfIso(b.date) >= today && !b.done) del("blocks", b.id); });
    res.planning.slice(0, 120).forEach(b => {
      if (!b || !/^\d{4}-\d{2}-\d{2}$/.test(b.date || "") || !/^\d{1,2}:\d{2}$/.test(b.start || "") || !/^\d{1,2}:\d{2}$/.test(b.end || "")) return;
      if (dayOfIso(b.date) < today || b.done) return;
      let taskId = null; const tk = String(b.task || "");
      if (tk.startsWith("new:")) taskId = newIds[+tk.slice(4)] || null; else if (S.tasks.has(tk)) taskId = tk;
      put("blocks", {id: uid(), date: b.date, start: hm(toMin(b.start)), end: hm(toMin(b.end)), title: clean(b.title) || "Créneau", subject: b.subject === "Révisions" ? "Révisions" : subj(b.subject), taskId, done: false});
    });
  }
  if (typeof res.memo === "string" && res.memo.trim()){ S.meta = {...S.meta, assistMemo: res.memo.trim().slice(0, 1500)}; saveMeta(); }
  // ménage : créneaux de plus de 14 jours
  [...S.blocks.values()].forEach(b => { if (dayOfIso(b.date) < today - 14) del("blocks", b.id); });
}

function renderPlanSide(){

    if (off) off.onclick = () => confirmModal("Couper la synchro avec Google Agenda ?", "Les créneaux déjà ajoutés restent dans ton agenda ; les prochains n'y seront plus envoyés.", "Couper", () => { S.meta = {...S.meta, gcalSync: false}; saveMeta(); renderPlanSide(); }); }
  const today = realToday(), nowM = new Date().getHours() * 60 + new Date().getMinutes();
  const days = Array.from({length: 7}, (_, i) => today + i);

  const open = tasks.filter(t => !t.done), done = tasks.filter(t => t.done);

      ${dueT.map(t => `<div class="pdue">${ic("flag")}À rendre : ${esc(t.title)}</div>`).join("")}
      ${(bs.length || agendaOf(isoDay(n)).length) ? mergeAgenda(n, bs).map(b => b.__ag ? agendaRow(b, n) : (b => { const past = n === today && toMin(b.end) < nowM; const nowB = n === today && toMin(b.start) <= nowM && nowM < toMin(b.end);
        return `<div class="blk ${b.done ? "done" : ""} ${past ? "past" : ""} ${nowB ? "now" : ""}" style="--c:${subjColor(b.subject)}"><button class="chk" data-bdone="${b.id}" aria-label="${b.done ? "Marquer comme à faire" : "Marquer comme fait"}">${b.done ? ic("check") : ""}</button><span class="t num">${b.start}<small>${b.end}</small></span><span class="nm">${esc(b.title)}<small>${esc(b.subject || "")}${nowB ? " · en cours" : ""}${b.subject === "Révisions" ? ` · <button class="lnk" data-brev style="font-size:inherit;padding:0">réviser</button>` : ""}</small></span><button class="x" data-bdel="${b.id}" aria-label="Supprimer le créneau">${ic("x")}</button></div>`; })(b)).join("")
        : `<p class="pempty">${n === today ? "Rien de prévu." : "Libre."}</p>`}</div>`;
  };
  const taskRow = t => `<div class="trow ${t.done ? "done" : ""}" style="--c:${subjColor(t.subject)}"><button class="chk" data-tdone="${t.id}" aria-label="${t.done ? "Remettre à faire" : "Marquer comme fait"}">${t.done ? ic("check") : ""}</button><span class="nm">${esc(t.title)}<small><i></i>${esc(t.subject || "Autre")}${t.minutes ? ` · ${fmtDur(t.minutes * MIN)}` : ""}${t.priority === "haute" ? " · prioritaire" : ""}</small></span><span class="due">${dueLbl(t)}</span><button class="x" data-tdel="${t.id}" aria-label="Supprimer la tâche">${ic("x")}</button></div>`;
  el.innerHTML = `
    <article class="box"><div class="box-h"><div><h2>Planning</h2><span class="s">7 prochains jours</span></div>${blocks.some(b => dayOfIso(b.date) >= today) ? "" : ""}</div>
      ${blocks.some(b => dayOfIso(b.date) >= today) || open.some(t => t.due) ? `<div class="pdays">${days.map(dayHtml).join("")}</div>` : `<p class="empty-note">Ton planning apparaîtra ici dès que tu m'auras dit ce que tu as à faire.</p>`}
    </article>
    <article class="box"><div class="box-h"><div><h2>Tâches</h2><span class="s">${open.length ? plural(open.length, "tâche à faire", "tâches à faire") : "Rien à faire pour l'instant"}</span></div></div>
      <div class="tlist">${open.map(taskRow).join("") || `<p class="empty-note" style="margin:0">Aucune tâche. Dis par exemple : « J'ai un DM de physique pour vendredi ».</p>`}</div>
      ${done.length ? `<details class="tdone"><summary>${plural(done.length, "tâche terminée", "tâches terminées")}</summary><div class="tlist">${done.slice(0, 30).map(taskRow).join("")}</div></details>` : ""}
    </article>`;
  $$("[data-tdone]", el).forEach(b => b.onclick = () => { const t = S.tasks.get(b.dataset.tdone); if (!t) return; put("tasks", {...t, done: !t.done, doneAt: !t.done ? Date.now() : null}); if (!t.done) [...S.blocks.values()].forEach(x => { if (x.taskId === t.id && dayOfIso(x.date) >= realToday() && !x.done) del("blocks", x.id); }); renderPlanSide(); });
  $$("[data-tdel]", el).forEach(b => b.onclick = () => { const id = b.dataset.tdel, t = S.tasks.get(id); del("tasks", id); [...S.blocks.values()].forEach(x => { if (x.taskId === id && !x.done) del("blocks", x.id); }); renderPlanSide(); gcalSync(); toast(`« ${t ? t.title : "Tâche"} » supprimée.`); });
  $$("[data-bdone]", el).forEach(b => b.onclick = () => { const x = S.blocks.get(b.dataset.bdone); if (x){ put("blocks", {...x, done: !x.done}); renderPlanSide(); } });
  $$("[data-bdel]", el).forEach(b => b.onclick = () => { del("blocks", b.dataset.bdel); renderPlanSide(); gcalSync(); });
  $$("[data-brev]", el).forEach(b => b.onclick = () => startStudy(ALL));
}

/* ================= fenêtre vocale (micro hors du cadre claude.ai) ================= */
/* Dans claude.ai, Centrale tourne dans un cadre qui n'a pas accès au micro.
   Le bouton ouvre alors Centrale dans une petite fenêtre à part, au premier plan
   du navigateur, où le micro est autorisé. Cette fenêtre écoute, envoie le texte
   à Centrale (qui garde les données et Claude), puis lit la réponse à voix haute. */
const VOICE_HASH = "#voix";
const isVoiceWindow = window.top === window && location.hash === VOICE_HASH;
let voiceWin = null, voiceReady = false, voiceT = null, dbNsG = null;
const inFrame = (() => { try { return window.top !== window; } catch(e){ return true; } })();
const micAllowedHere = () => { try { const fp = document.permissionsPolicy || document.featurePolicy; return fp ? fp.allowsFeature("microphone") : null; } catch(e){ return null; } };

function diag(o){
  try {
    if (!dbNsG) return;
    const id = "voice-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    dbNsG.collection("diag").doc(id).set({t: Date.now(), ua: navigator.userAgent.slice(0, 160), inFrame, fp: micAllowedHere(), sr: !!SR, ...o}).catch(() => {});
  } catch(e){}
}

/* --- côté Centrale (dans le cadre) --- */
function openVoiceWindow(){
  const url = location.href.split("#")[0] + VOICE_HASH;
  let w = null;
  try { w = window.open(url, "centrale-voix", "popup=yes,width=440,height=700,left=40,top=60"); } catch(e){ w = null; }
  if (!w){ diag({step: "popup", ok: false}); voiceFallback("popup"); return; }
  voiceWin = w; voiceReady = false;
  try { w.focus(); } catch(e){}
  setAState("listening"); const l = $("#orb-l"); if (l) l.textContent = "Fenêtre vocale ouverte…";
  clearTimeout(voiceT);
  voiceT = setTimeout(() => { if (!voiceReady){ diag({step: "handshake", ok: false}); setAState("idle"); voiceFallback("handshake"); } }, 9000);
}
function voiceFallback(kind){
  if (kind !== "popup"){ S.meta = {...S.meta, voiceMode: "dictee"}; saveMeta(); }
  asst.micBlocked = true;
  dictateMode(true, kind);
}
window.addEventListener("message", e => {
  const d = e.data;
  if (!d || typeof d !== "object" || typeof d.cv !== "string") return;
  if (isVoiceWindow) return;                       // géré par la fenêtre vocale elle-même
  if (!voiceWin || e.source !== voiceWin) return;  // seulement notre fenêtre
  if (d.cv === "hello"){
    voiceReady = true; clearTimeout(voiceT);
    S.meta = {...S.meta, voiceMode: "fenetre"}; saveMeta(); asst.micBlocked = false;
    diag({step: "handshake", ok: true, origin: e.origin});
    setAState("idle"); const l = $("#orb-l"); if (l) l.textContent = "Parle dans la fenêtre vocale";
    voicePost({cv: "log", log: asst.log.slice(-6)});
  } else if (d.cv === "text" && typeof d.text === "string"){
    sendToAssistant(d.text.slice(0, 2000), true);
  } else if (d.cv === "state"){
    if (view.name === "plan"){ const l = $("#orb-l"); if (l) l.textContent = d.state === "listening" ? "Je t'écoute (fenêtre vocale)…" : d.state === "speaking" ? "Je te réponds…" : "Parle dans la fenêtre vocale"; }
  } else if (d.cv === "diag"){
    diag({step: "window", ...d.info});
  } else if (d.cv === "bye"){
    voiceWin = null; voiceReady = false; setAState("idle");
  }
});
function voicePost(msg){ try { if (voiceWin && !voiceWin.closed) voiceWin.postMessage(msg, "*"); } catch(e){} }
const voiceLinked = () => voiceWin && !voiceWin.closed && voiceReady;

/* --- côté fenêtre vocale (au premier plan) --- */
function voiceWindowMain(){
  document.title = "Centrale · Assistant vocal";

    <div class="orb-wrap"><button class="orb" id="vorb" data-s="idle" aria-label="Parler"><span class="ring r1"></span><span class="ring r2"></span><span class="core"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></button>

  </div>`;
  const opener = window.opener;
  const st = $("#vstate"), live = $("#vlive"), log = $("#vlog"), orb = $("#vorb");
  let rec = null, heard = "", interim = "", silT = null, state = "idle", msgs = [];
  const post = m => { try { opener && opener.postMessage(m, "*"); } catch(e){} };
  const setS = (s, txt) => { state = s; orb.dataset.s = s; if (txt) st.textContent = txt; live.hidden = s !== "listening"; post({cv: "state", state: s}); };
  const paint = () => { log.innerHTML = msgs.map(m => `<div class="msg ${m.who}">${m.who === "me" ? "" : `<span class="who">${m.who === "sys" ? "Info" : "Assistant"}</span>`}<p>${esc(m.text)}</p></div>`).join(""); log.scrollTop = log.scrollHeight; };
  if (!opener){
    msgs.push({who: "sys", text: "Cette fenêtre a perdu le lien avec Centrale. Ferme-la et touche à nouveau le bouton micro dans l'onglet Assistant."}); paint();
    st.textContent = "Pas de lien avec Centrale"; return;
  }
  const voice = pickVoice();
  const say = text => {
    if (!("speechSynthesis" in window)){ afterSpeak(); return; }
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; const v = voice || pickVoice(); if (v) u.voice = v; u.rate = 1.04;
    u.onstart = () => setS("speaking", "Touche pour m'interrompre"); u.onend = u.onerror = () => afterSpeak();
    speechSynthesis.speak(u);
  };
  const afterSpeak = () => { if ($("#vcont").checked) listen(true); else setS("idle", "Touche pour parler"); };
  const finish = () => { clearTimeout(silT); if (rec){ try { rec.stop(); } catch(e){} } };
  function listen(auto){
    if (!SR){ msgs.push({who: "sys", text: "Ce navigateur ne propose pas la reconnaissance vocale. Utilise Chrome ou Safari."}); paint(); post({cv: "diag", info: {micOk: false, err: "no-sr"}}); return; }
    try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch(e){}
    const r = new SR(); rec = r; heard = ""; interim = "";
    r.lang = "fr-FR"; r.continuous = true; r.interimResults = true;
    r.onresult = e => {
      let fin = "", tmp = "";
      for (let i = 0; i < e.results.length; i++){ const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else tmp += t; }
      heard = fin; interim = (fin + " " + tmp).trim(); live.textContent = interim;
      clearTimeout(silT); silT = setTimeout(finish, 2200);
    };
    r.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture"){
        msgs.push({who: "sys", text: "Le navigateur refuse le micro pour cette fenêtre. Clique sur l'icône du micro ou du cadenas dans la barre d'adresse et choisis « Autoriser », puis touche le bouton."}); paint();
        post({cv: "diag", info: {micOk: false, err: e.error}});
      }
    };
    r.onend = () => { if (rec !== r) return; rec = null; const txt = (interim || heard).trim(); interim = "";
      if (txt){ msgs.push({who: "me", text: txt}); paint(); setS("thinking", "Je prépare ta réponse…"); post({cv: "text", text: txt}); post({cv: "diag", info: {micOk: true}}); }
      else setS("idle", auto ? "Touche pour parler" : "Je n'ai rien entendu. Touche pour réessayer."); };
    r.start(); live.textContent = "Dis-moi ce que tu as à faire…"; setS("listening", "Je t'écoute…");
    silT = setTimeout(() => { if (!interim) finish(); }, auto ? 6000 : 9000);
  }
  orb.onclick = () => {
    if (state === "listening"){ finish(); return; }
    if (state === "speaking"){ try { speechSynthesis.cancel(); } catch(e){} setS("idle", "Touche pour parler"); listen(false); return; }
    if (state === "thinking") return;
    listen(false);
  };
  window.addEventListener("message", e => {
    if (e.source !== opener) return; const d = e.data; if (!d || typeof d.cv !== "string") return;
    if (d.cv === "reply"){ msgs.push({who: d.sys ? "sys" : "ai", text: String(d.text || "")}); paint(); if (d.sys) setS("idle", "Touche pour parler"); else say(String(d.text || "")); }
    else if (d.cv === "log" && Array.isArray(d.log)){ msgs = d.log.filter(m => m && m.who !== "sys").map(m => ({who: m.who, text: String(m.text || "")})); paint(); }
  });
  window.addEventListener("beforeunload", () => post({cv: "bye"}));
  post({cv: "hello"});
  setS("idle", "Touche pour parler");
  msgs.length || (msgs.push({who: "sys", text: "Touche le bouton et parle normalement : « J'ai un DM de maths pour jeudi », « Qu'est-ce que je fais ce soir ? »… Garde cette fenêtre ouverte à côté de Centrale."}), paint());
}

/* ================= Google Agenda (lecture des cours, écriture des créneaux) ================= */
const GCAL = "Google Calendar";
let mcpNs = null, gcalBusy = null, gcalErr = null, gcalAt = 0;
const gcalOn = () => S.meta.gcalSync !== false;
const pad2 = n => String(n).padStart(2, "0");
const localIso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`;
function payloadOf(r){ let p = r && r.payload; if (typeof p === "string"){ try { p = JSON.parse(p); } catch(e){} } return p; }
async function gcalLoad(force){
  if (!mcpNs) return null;
  if (!force && gcalBusy && Date.now() - gcalAt < 5 * MIN) return gcalBusy;
  try {
    const now = new Date(), end = new Date(now.getTime() + 8 * DAY);
    let token = null, out = [];
    for (let page = 0; page < 4; page++){
      const r = await mcpNs.callTool(GCAL, "list_events", {startTime: localIso(now), endTime: localIso(end), orderBy: "startTime", pageSize: 250, ...(token ? {pageToken: token} : {})});
      const p = payloadOf(r) || {};
      (p.events || []).forEach(ev => {
        if (!ev || ev.status === "cancelled" || !ev.start || !ev.start.dateTime) return;
        if (String(ev.description || "").includes("Planifié par Centrale")) return;
        const s = new Date(ev.start.dateTime), e = new Date(ev.end.dateTime);
        out.push({date: localIso(s).slice(0, 10), start: localIso(s).slice(11, 16), end: localIso(e).slice(11, 16), title: String(ev.summary || "Occupé").slice(0, 60)});
      });
      token = p.nextPageToken; if (!token) break;
    }
    gcalBusy = out; gcalErr = null; gcalAt = Date.now();
  } catch(e){ console.error(e); gcalErr = e && e.code || "erreur"; }
  return gcalBusy;
}
let gcalChain = Promise.resolve();
function gcalSync(){
  if (!mcpNs || !gcalOn()) return;
  gcalChain = gcalChain.then(async () => {
    const today = realToday();
    // supprimer les événements des créneaux disparus
    const live = new Set([...S.blocks.values()].map(b => b.gEvent).filter(Boolean));
    const known = S.meta.gcalEvents || {};
    for (const [evId, info] of Object.entries(known)){
      if (live.has(evId)) continue;
      if (info && info.date && dayOfIso(info.date) < today){ delete known[evId]; continue; }
      try { await mcpNs.callTool(GCAL, "delete_event", {eventId: evId, notificationLevel: "NONE"}); delete known[evId]; }
      catch(e){ if (e && (e.code === "tool_error")) delete known[evId]; else { gcalErr = e && e.code; break; } }
    }
    // créer les nouveaux créneaux à venir
    const nowM = new Date().getHours() * 60 + new Date().getMinutes();
    const todo = [...S.blocks.values()].filter(b => !b.gEvent && !b.done && (dayOfIso(b.date) > today || (dayOfIso(b.date) === today && toMin(b.end) > nowM)) && dayOfIso(b.date) <= today + 7);
    for (const b of todo){
      try {

function popMenu(anchor, items){
  closeMenu();
  const m = document.createElement("div"); m.className = "menu"; m.id = "menu"; m.setAttribute("role", "menu");
  m.innerHTML = items.map((it, i) => it === "-" ? "<hr>" : `<button role="menuitem" data-i="${i}" class="${it.danger ? "danger" : ""}">${ic(it.icon)}${esc(it.label)}</button>`).join("");
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  const top = r.bottom + 6 + m.offsetHeight > window.innerHeight ? r.top - m.offsetHeight - 6 : r.bottom + 6;
  m.style.top = Math.max(8, top) + "px";
  m.style.left = Math.max(8, Math.min(window.innerWidth - m.offsetWidth - 8, r.right - m.offsetWidth)) + "px";
  m.onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; e.stopPropagation(); closeMenu(); items[+b.dataset.i].run(); };
  m.addEventListener("keydown", e => {
    const bs = $$("button", m), i = bs.indexOf(document.activeElement);
    if (e.key === "Escape"){ closeMenu(); anchor.focus(); }
    if (e.key === "ArrowDown"){ e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    if (e.key === "ArrowUp"){ e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
  });
  setTimeout(() => document.addEventListener("click", closeMenu, {once: true}), 0);
}

function modal({title, body, foot = "", wide = false, onClose}){
  const s = document.createElement("div"); s.className = "scrim";
  s.innerHTML = `<div class="modal ${wide ? "wide" : ""} rise" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h2>${esc(title)}</h2><button class="btn quiet icon" data-x aria-label="Fermer">${ic("x")}</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ""}</div>`;
  document.body.appendChild(s);
  const onKey = e => { if (e.key === "Escape"){ e.stopPropagation(); close(); } };
  const close = () => { s.remove(); document.removeEventListener("keydown", onKey, true); onClose && onClose(); };
  document.addEventListener("keydown", onKey, true);
  $("[data-x]", s).onclick = close;
  s.addEventListener("mousedown", e => { if (e.target === s) close(); });
  const f = s.querySelector(".modal-b input:not([type=checkbox]):not([type=file]),.modal-b textarea,.modal-b select"); if (f) setTimeout(() => f.focus(), 40);
  return {el: s, close};

/* ================= classeur : matières › types de documents › dossiers ================= */
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const TYPES = ["Cours", "TD et exercices", "DS et devoirs", "Colles", "Fiches de révision"];
const DEFAULT_SUBJECTS = [
  {name: "Maths", keys: ["maths", "math", "mathematiques"], color: 1},
  {name: "Physique-Chimie", keys: ["physique", "chimie", "physique chimie", "pc"], color: 2},
  {name: "Sciences de l'ingénieur", keys: ["si", "sii", "sciences de l ingenieur"], color: 3},
  {name: "Informatique", keys: ["info", "informatique", "python", "itc"], color: 6},
  {name: "Français-Philosophie", keys: ["francais", "philo", "philosophie", "francais philosophie"], color: 4},
  {name: "Anglais", keys: ["anglais", "english"], color: 7},
  {name: "TIPE", keys: ["tipe"], color: 5, types: ["Recherches et articles", "Expériences", "Rapport et oral"]}
];
const TYPE_ICON = {"cours": "doc", "td et exercices": "edit", "ds et devoirs": "check", "colles": "clock", "fiches de revision": "cards"};
const sortF = (a, b) => (a.order ?? 999) - (b.order ?? 999) || a.name.localeCompare(b.name, "fr", {numeric: true});
const childFolders = pid => [...S.folders.values()].filter(f => (f.parentId || "") === (pid || "")).sort(sortF);
function rootOf(id){ let f = S.folders.get(id), n = 0; while (f && f.parentId && n++ < 50) f = S.folders.get(f.parentId); return f || null; }
function folderPath(id){ const out = []; let f = S.folders.get(id), n = 0; while (f && n++ < 50){ out.unshift(f); f = f.parentId ? S.folders.get(f.parentId) : null; } return out; }
function folderSubtree(id){ const ids = new Set([id]); let grew = true; while (grew){ grew = false; for (const f of S.folders.values()) if (f.parentId && ids.has(f.parentId) && !ids.has(f.id)){ ids.add(f.id); grew = true; } } return ids; }
const docsIn = id => [...S.pdfs.values()].filter(p => p.folderId === id).sort((a, b) => a.name.localeCompare(b.name, "fr", {numeric: true, sensitivity: "base"}));
function docsUnder(id){ const ids = folderSubtree(id); return [...S.pdfs.values()].filter(p => ids.has(p.folderId)); }
function folderColor(f){ const r = f && (f.parentId ? rootOf(f.id) : f); return `var(--s${(r && r.color) || 8})`; }
function subjectKeys(f){ return (f.keys && f.keys.length ? f.keys : [norm(f.name)]).map(norm); }
function subjectForName(name){
  const n = norm(String(name || "").split("::")[0]);
  if (!n) return null;
  for (const f of childFolders("")) for (const k of subjectKeys(f)) if (n === k || n.startsWith(k + " ")) return f;
  return null;
}
function makeFolder(name, parentId, extra = {}){
  const f = {id: uid(), name, parentId: parentId || "", order: childFolders(parentId).length, created: Date.now(), ...extra};
  put("folders", f); return f;
}
function ensureChild(parent, name){
  return childFolders(parent.id).find(f => norm(f.name) === norm(name)) || makeFolder(name, parent.id);
}
function unsortedFolder(){ return childFolders("").find(f => f.unsorted) || makeFolder("Non classés", "", {unsorted: true, color: 8, order: 99}); }
// Dossier où ranger un document lié à un paquet : matière du paquet › type
function folderForDeck(deck, type){
  let subj = deck && subjectForName(deck.name);
  if (!subj && deck){ subj = makeFolder(deck.name.split("::")[0], "", {keys: [norm(deck.name.split("::")[0])], color: 1 + (childFolders("").length % 7)}); TYPES.forEach((t, i) => makeFolder(t, subj.id, {order: i})); }
  if (!subj) return unsortedFolder().id;
  return ensureChild(subj, type || "Cours").id;
}
let foldersReady = false;
function setupFolders(){
  if (!S.ready) return;
  if (!S.folders.size && !S.meta.foldersSeeded){
    DEFAULT_SUBJECTS.forEach((d, i) => {
      const f = makeFolder(d.name, "", {keys: d.keys, color: d.color, order: i});
      (d.types || TYPES).forEach((t, j) => makeFolder(t, f.id, {order: j}));
    });
    S.meta.foldersSeeded = Date.now(); saveMeta();
  }
  // Range les documents existants qui n'ont pas encore de dossier
  [...S.pdfs.values()].filter(p => !p.folderId || !S.folders.has(p.folderId)).forEach(p => {
    const deck = p.deckId && S.decks.get(p.deckId);
    put("pdfs", {...p, folderId: deck ? folderForDeck(deck, "Cours") : unsortedFolder().id});
  });
  foldersReady = true;
}
function deleteDoc(p){ del("pdfs", p.id); if (assets && p.assetId) assets.delete(p.assetId).catch(() => {}); }
const isImage = p => p.kind === "image" || /^image\//.test(p.mime || "");

function docRow(p, showWhere){
  const deck = p.deckId && S.decks.get(p.deckId);
  const where = showWhere ? folderPath(p.folderId).map(f => f.name).join(" › ") : "";
  return `<div class="doc">
    <div class="ficon ${isImage(p) ? "img" : ""}">${isImage(p) ? "IMG" : "PDF"}</div>
    <button class="open" data-dview="${p.id}"><div class="fname" title="${esc(p.name)}">${esc(p.name)}</div>

async function uploadToFolder(files, folderId){

  for (const f of files){
    if (f.size > 20 * 1048576){ toast(`« ${f.name} » dépasse 20 Mo.`); continue; }
    toast(`Envoi de « ${f.name} »…`, 0);
    const pdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);

      let pages = 0;
      if (pdf){ try { const doc = await openPdf(await f.arrayBuffer()); pages = doc.numPages; doc.destroy(); } catch(e){} }
